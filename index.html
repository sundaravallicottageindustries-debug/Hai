<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sundaravalli Cottage Industries — Master Data</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3440">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1A1D21;
  --graphite:#2B3440;
  --graphite-2:#37414E;
  --paper:#FAFAF7;
  --paper-2:#F0EEE8;
  --line:#DCD8CE;
  --amber:#E8A33D;
  --amber-dark:#C6862A;
  --teal:#3D8B85;
  --red:#B0473F;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper-2);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;}
a{color:inherit;}

/* ---------- Layout shell ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:238px;flex-shrink:0;background:var(--graphite);color:#EFEDE7;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  transform:translateX(0);transition:transform .2s ease;z-index:40;
}
.sidebar .brand{
  padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);
}
.brand .plate{
  display:inline-block;border:1.5px solid var(--amber);color:var(--amber);
  font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;
  padding:3px 8px;border-radius:4px;margin-bottom:8px;
}
.brand h1{font-size:15px;margin:0;line-height:1.35;font-weight:600;}
.brand p{margin:4px 0 0;font-size:11.5px;color:#B7BEC7;font-family:var(--mono);}

.nav{flex:1;overflow-y:auto;padding:10px 0;}
.nav button{
  width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;
  color:#D7DBE0;text-align:left;padding:10px 18px;cursor:pointer;font-size:14px;
  border-left:3px solid transparent;
}
.nav button .num{
  font-family:var(--mono);font-size:10.5px;color:#8A93A0;border:1px solid #4A5560;
  border-radius:3px;padding:1px 5px;min-width:22px;text-align:center;
}
.nav button:hover{background:rgba(255,255,255,.05);}
.nav button.active{background:rgba(232,163,61,.12);border-left-color:var(--amber);color:#fff;}
.nav button.active .num{border-color:var(--amber);color:var(--amber);}
.nav .sect-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:#6C7480;padding:14px 18px 4px;
}
.sidebar-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8A93A0;font-family:var(--mono);}

.main{flex:1;margin-left:238px;min-width:0;}
.topbar{
  display:none;position:sticky;top:0;z-index:30;background:var(--graphite);color:#fff;
  align-items:center;gap:12px;padding:12px 16px;
}
.topbar button.hamburger{
  background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;
  width:36px;height:36px;font-size:16px;cursor:pointer;
}
.topbar .tb-title{font-size:14px;font-weight:600;font-family:var(--mono);}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}

.content{padding:26px 30px 60px;max-width:1180px;}

/* ---------- Dashboard ---------- */
.hero{
  background:var(--graphite);color:#fff;border-radius:10px;padding:22px 24px;
  margin-bottom:22px;position:relative;overflow:hidden;
  border:1px solid #1F262E;
}
.hero:before{
  content:"";position:absolute;top:0;right:0;bottom:0;width:6px;background:var(--amber);
}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
.hero h2{margin:6px 0 4px;font-size:22px;}
.hero p{margin:0;color:#C3C9D0;font-size:13.5px;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;
  transition:border-color .15s, transform .15s;
}
.stat-card:hover{border-color:var(--amber);transform:translateY(-1px);}
.stat-card .sc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .num{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:#8B8578;}
.stat-card h3{font-size:13.5px;margin:10px 0 2px;color:#4A4F55;}
.stat-card .count{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--graphite);}
.stat-card .sub{font-size:11.5px;color:#8B8578;margin-top:2px;}
.stat-card.warn .count{color:var(--red);}

.alert-box{
  background:#FBF1E7;border:1px solid #EFC98D;border-left:4px solid var(--amber-dark);
  border-radius:6px;padding:14px 16px;margin-bottom:22px;
}
.alert-box h4{margin:0 0 8px;font-size:13px;color:#8A5A16;font-family:var(--mono);letter-spacing:.03em;}
.alert-box ul{margin:0;padding-left:18px;font-size:13.5px;color:#5C4318;}
.alert-box li{margin-bottom:3px;}

/* ---------- Master view ---------- */
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
.view-head .vh-left .eyebrow{font-family:var(--mono);font-size:11px;color:#8B8578;letter-spacing:.1em;text-transform:uppercase;}
.view-head h2{margin:2px 0 0;font-size:20px;}

.btn{
  border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--amber);color:#28210D;}
.btn-primary:hover{background:var(--amber-dark);}
.btn-ghost{background:#fff;color:var(--graphite);border:1px solid var(--line);}
.btn-ghost:hover{border-color:#B9B2A2;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#8F3830;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:5px;}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.toolbar input[type=search]{
  flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;
}
.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}

.table-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#8B8578;
  padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper);font-weight:600;
}
tbody td{padding:11px 14px;border-bottom:1px solid #EEEBE3;font-size:14px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FCFAF6;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.mono{font-family:var(--mono);}
.name-cell{font-weight:600;}
.name-cell .sub{display:block;font-weight:400;font-size:12px;color:#8B8578;}

.badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
.badge.active{background:#E4F1EF;color:var(--teal);}
.badge.inactive{background:#F1E4E2;color:var(--red);}
.badge.low{background:#FBE7E5;color:var(--red);}

.empty-state{padding:50px 20px;text-align:center;color:#9A9484;}
.empty-state .es-icon{font-size:30px;margin-bottom:8px;}
.empty-state h4{margin:0 0 4px;color:#5A554A;font-size:15px;}
.empty-state p{margin:0;font-size:13px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(20,22,25,.55);z-index:50;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;
}
.modal{
  background:#fff;border-radius:10px;max-width:520px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;padding:18px 20px;
  border-bottom:1px solid var(--line);
}
.modal-head h3{margin:0;font-size:16px;}
.modal-head .mh-tag{font-family:var(--mono);font-size:10.5px;color:#8B8578;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#8B8578;line-height:1;}
.modal-body{padding:18px 20px;max-height:65vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:#4A4F55;margin-bottom:5px;}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:11.5px;color:#9A9484;margin-top:3px;}
.field .err{font-size:11.5px;color:var(--red);margin-top:3px;display:none;}
.field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--red);}
.field.has-error .err{display:block;}

.status-toggle{display:flex;gap:8px;}
.status-toggle label{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
  border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#6A6458;
}
.status-toggle input{width:auto;margin:0;}
.status-toggle input:checked + span{color:inherit;}
.status-toggle label.opt-active{has(input:checked)}
.status-toggle label:has(input:checked).opt-active{background:#E4F1EF;border-color:var(--teal);color:var(--teal);}
.status-toggle label:has(input:checked).opt-inactive{background:#F1E4E2;border-color:var(--red);color:var(--red);}

.confirm-modal .modal-body p{font-size:14.5px;line-height:1.5;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--graphite);color:#fff;padding:11px 16px;border-radius:7px;font-size:13.5px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);min-width:200px;border-left:4px solid var(--teal);
  animation:slideIn .18s ease;
}
.toast.err{border-left-color:var(--red);}
@keyframes slideIn{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ---------- Purchase module ---------- */
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.quick-actions .btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);}
.quick-actions .btn:hover{background:rgba(255,255,255,.2);}

.filters-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;}
.filters-row input[type=search],.filters-row input[type=date],.filters-row select{
  padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;
}
.filters-row input[type=search]{flex:1;min-width:160px;}
.filters-row .fr-label{font-size:11.5px;color:#9A9484;font-family:var(--mono);}

.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px;}
.panel h4{margin:0 0 14px;font-size:14px;font-family:var(--mono);color:#4A4F55;letter-spacing:.03em;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.form-grid .field{margin-bottom:0;}

.item-grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;}
table.item-grid{width:100%;border-collapse:collapse;min-width:900px;}
table.item-grid thead th{
  background:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8B8578;
  padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;
}
table.item-grid tbody td{padding:7px 8px;border-bottom:1px solid #EEEBE3;vertical-align:middle;}
table.item-grid input,table.item-grid select{
  width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;min-width:80px;
}
table.item-grid select{min-width:170px;}
table.item-grid .num-readout{font-family:var(--mono);font-size:13.5px;white-space:nowrap;padding:0 4px;}
table.item-grid .row-remove{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px;}
table.item-grid .row-remove:disabled{color:#C9C4B8;cursor:not-allowed;}

.totals-bar{
  display:flex;flex-wrap:wrap;gap:18px;justify-content:flex-end;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:18px;
}
.totals-bar .ti{text-align:right;}
.totals-bar .ti .tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9A9484;font-family:var(--mono);}
.totals-bar .ti .tv{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--graphite);}
.totals-bar .ti.grand .tv{color:var(--amber-dark);font-size:18px;}
.totals-bar .ti input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-family:var(--mono);text-align:right;}

.lock-note{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--red);background:#F1E4E2;
  border-radius:5px;padding:4px 9px;font-family:var(--mono);
}

.detail-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:18px;}
.detail-card .dc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:14px;}
.detail-card .dc-item .dl{font-size:11px;text-transform:uppercase;color:#9A9484;letter-spacing:.04em;font-family:var(--mono);}
.detail-card .dc-item .dv{font-size:14.5px;font-weight:600;margin-top:2px;}

.report-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.report-summary .rs-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.report-summary .rs-card .tl{font-size:11px;text-transform:uppercase;color:#9A9484;letter-spacing:.04em;font-family:var(--mono);}
.report-summary .rs-card .tv{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--graphite);margin-top:4px;}

#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;}
  #printArea table{width:100%;border-collapse:collapse;}
  #printArea th, #printArea td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left;}
  #printArea h2{margin:0 0 4px;}
  #printArea .p-sub{color:#555;font-size:12px;margin-bottom:14px;}
  #printArea .p-totals{margin-top:12px;font-size:13px;}
}

/* ---------- Mobile ---------- */
@media (max-width:880px){
  .sidebar{transform:translateX(-100%);width:250px;}
  .sidebar.open{transform:translateX(0);}
  .overlay.show{display:block;}
  .main{margin-left:0;}
  .topbar{display:flex;}
  .content{padding:18px 14px 60px;}
  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{border-bottom:1px solid var(--line);padding:10px 14px;}
  tbody td{border:none;padding:4px 0;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;}
  tbody td:before{content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#9A9484;font-weight:600;}
  tbody td.row-actions-cell{justify-content:flex-end;padding-top:8px;}
  tbody td.row-actions-cell:before{content:"";}
  .table-wrap{border:none;background:none;}
  tbody tr{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
}
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <span class="plate">SV · 1958</span>
      <h1>Sundaravalli Cottage Industries</h1>
      <p>Master Data · Module 1</p>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot">Offline-first · Data stored on this device</div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <span class="tb-title" id="tbTitle">Dashboard</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-backdrop" id="formBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="formTitle">Add Record</h3>
        <div class="mh-tag" id="formTag"></div>
      </div>
      <button class="modal-close" id="formClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="formBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="formCancel">Cancel</button>
      <button class="btn btn-primary" id="formSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmBackdrop">
  <div class="modal confirm-modal">
    <div class="modal-head">
      <h3>Delete record?</h3>
      <button class="modal-close" id="confirmClose">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirmText">Are you sure you want to delete this record?</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="printArea"></div>

<script>
/* ============================================================
   Sundaravalli Cottage Industries — Master Data (Module 1)
   Single-file offline-first PWA. IndexedDB storage.
   Schema is designed to be reused unchanged by future modules:
   Purchase, Stock, Formula/BOM, Manufacturing, Packing,
   Costing, Sales, Reports, WhatsApp integration.
   ============================================================ */

const DB_NAME = 'sundaravalli_erp';
const DB_VERSION = 2;
const STORES = ['rawMaterials','suppliers','products','packingMaterials','labour','electricity','machines','expenses','units',
  'purchases','purchaseReturns','stockMovements','auditLog','counters'];

let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      STORES.forEach(name=>{
        if(!_db.objectStoreNames.contains(name)){
          _db.createObjectStore(name, {keyPath:'id'});
        }
      });
    };
    req.onsuccess = ()=>{ db = req.result; resolve(db); };
    req.onerror = ()=> reject(req.error);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function dbGetAll(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readonly').getAll();
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}
function dbPut(store, obj){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').put(obj);
    r.onsuccess = ()=>resolve(obj);
    r.onerror = ()=>reject(r.error);
  });
}
function dbDelete(store, id){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').delete(id);
    r.onsuccess = ()=>resolve();
    r.onerror = ()=>reject(r.error);
  });
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

/* ---------------- Master configuration ---------------- */
function getUnitOptions(){
  return (cache.units||[]).filter(u=>u.status!=='Inactive').map(u=>({value:u.name, label:u.name}));
}
function getSupplierOptions(){
  return (cache.suppliers||[]).filter(s=>s.status!=='Inactive').map(s=>({value:s.id, label:s.name}));
}
function supplierName(id){
  const s=(cache.suppliers||[]).find(x=>x.id===id);
  return s? s.name : '—';
}

const MASTERS = [
  {
    key:'rawMaterials', num:'M1', label:'Raw Materials', singular:'Raw Material', nameField:'name',
    dupKeyLabel:'Raw Material Name',
    fields:[
      {key:'name', label:'Raw Material Name', type:'text', required:true},
      {key:'category', label:'Category', type:'text', required:true},
      {key:'unit', label:'Unit of Measure', type:'select', options:getUnitOptions, required:true, placeholder:'Select unit'},
      {key:'openingStock', label:'Opening Stock', type:'number', required:true, min:0},
      {key:'minStock', label:'Minimum Stock Level', type:'number', required:true, min:0},
      {key:'supplierId', label:'Default Supplier', type:'select', options:getSupplierOptions, placeholder:'Select supplier'},
      {key:'purchaseRate', label:'Purchase Rate (₹)', type:'number', min:0},
      {key:'remarks', label:'Remarks', type:'textarea'},
    ],

/* ---------------- App state ---------------- */
let cache = {};          // in-memory copies of every store
let currentKey = null;   // active master key, null = dashboard
let editState = {store:null, id:null};
let deleteState = {store:null, id:null, label:''};
let searchQ = '';
let statusFilter = 'All';

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function lowStockCell(r){
  const stock = r.currentStock!=null ? r.currentStock : r.openingStock;
  const low = Number(stock) <= Number(r.minStock);
  return `${esc(stock)} ${low? '<span class="badge low">LOW</span>':''}`;
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
}

/* ---------------- Boot ---------------- */
async function boot(){
  await openDB();
  await reloadAllCache();
  await seedDefaultUnits();
  await migrateStockFields();
  renderNav();
  renderDashboard();
  wireGlobalUI();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
async function reloadAllCache(){
  for(const s of STORES){ cache[s] = await dbGetAll(s); }
}
async function migrateStockFields(){
  for(const key of ['rawMaterials','packingMaterials']){
    let changed = false;
    for(const r of (cache[key]||[])){
      if(r.currentStock===undefined){
        r.currentStock = Number(r.openingStock)||0;
        r.avgCost = Number(r.purchaseRate)||0;
        r.updatedAt = Date.now();
        await dbPut(key, r);
        changed = true;
      }
    }
    if(changed) cache[key] = await dbGetAll(key);
  }
}
async function seedDefaultUnits(){
  if(cache.units && cache.units.length===0){
    for(const name of DEFAULT_UNITS){
      const obj = {id:uid(), name, status:'Active', createdAt:Date.now(), updatedAt:Date.now()};
      await dbPut('units', obj);
    }
    cache.units = await dbGetAll('units');
  }
}

function renderMasterView(m){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="view-head">
      <div class="vh-left">
        <div class="eyebrow">${m.num} · Master Data</div>
        <h2>${esc(m.label)}</h2>
      </div>

    </div>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search ${esc(m.label.toLowerCase())}…" value="${esc(searchQ)}">
      <select id="statusFilterSel">
        <option value="All">All Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
  `;
  document.getElementById('addBtn').onclick = ()=> openForm(m.key, null);
  const si = document.getElementById('searchInput');
  si.oninput = ()=>{ searchQ = si.value; renderTable(m); };
  const sf = document.getElementById('statusFilterSel');
  sf.value = statusFilter;
  sf.onchange = ()=>{ statusFilter = sf.value; renderTable(m); };
  renderTable(m);
}

function filteredRows(m){
  let rows = (cache[m.key]||[]).slice();
  if(statusFilter!=='All'){ rows = rows.filter(r=>(r.status||'Active')===statusFilter); }
  if(searchQ.trim()){
    const q = searchQ.trim().toLowerCase();
    rows = rows.filter(r=> m.fields.some(f=>{
      const v = r[f.key];
      if(v===undefined||v===null) return false;
      if(f.key==='supplierId') return supplierName(v).toLowerCase().includes(q);
      return String(v).toLowerCase().includes(q);
    }));
  }
  if(m.sortDesc){
    rows.sort((a,b)=> String(b[m.sortDesc]||'').localeCompare(String(a[m.sortDesc]||'')));
  } else {
    rows.sort((a,b)=> String(a[m.nameField]||'').localeCompare(String(b[m.nameField]||'')));
  }
  return rows;
}

function renderTable(m){
  const wrap = document.getElementById('tableWrap');
  const rows = filteredRows(m);
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty-state">
      <div class="es-icon">📋</div>
      <h4>No ${esc(m.label.toLowerCase())} found</h4>
      <p>${searchQ||statusFilter!=='All' ? 'Try clearing your search or filter.' : 'Click "+ Add '+esc(m.singular)+'" to create the first record.'}</p>
    </div>`;
    return;
  }
  const thead = `<thead><tr>${m.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th>Status</th><th></th></tr></thead>`;
  const tbody = rows.map(r=>{
    const tds = m.columns.map(c=>{
      const val = c.render ? c.render(r) : esc(r[c.key]);
      return `<td data-label="${esc(c.label)}">${val}</td>`;
    }).join('');
    const status = r.status || 'Active';
    return `<tr>
      ${tds}
      <td data-label="Status"><span class="badge ${status==='Active'?'active':'inactive'}">${status}</span></td>
      <td class="row-actions-cell">
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${r.id}">Edit</button>
          <button class="btn btn-danger btn-sm" data-act="del" data-id="${r.id}">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>${thead}<tbody>${tbody}</tbody></table>`;
  wrap.querySelectorAll('[data-act=edit]').forEach(b=> b.onclick=()=>openForm(m.key, b.dataset.id));
  wrap.querySelectorAll('[data-act=del]').forEach(b=> b.onclick=()=>openConfirm(m.key, b.dataset.id));
}

/* ---------------- Form modal ---------------- */
function openForm(storeKey, id){
  const m = MASTERS.find(x=>x.key===storeKey);
  editState = {store:storeKey, id};
  const record = id ? (cache[storeKey]||[]).find(r=>r.id===id) : null;

  document.getElementById('formTitle').textContent = (id? 'Edit ':'Add ') + m.singular;
  document.getElementById('formTag').textContent = m.num + ' · ' + m.label;

  const body = document.getElementById('formBody');
  body.innerHTML = m.fields.map(f=> fieldHtml(f, record)).join('') + statusFieldHtml(record);
  // wire datalist for text fields with suggestions
  m.fields.forEach(f=>{
    if(f.list){
      const dl = document.createElement('datalist');
      dl.id = 'dl_'+f.key;
      dl.innerHTML = f.list.map(v=>`<option value="${esc(v)}">`).join('');
      body.appendChild(dl);
    }
    if(f.type==='select' && typeof f.options==='function'){
      const sel = body.querySelector(`[name="${f.key}"]`);
      const opts = f.options();
      sel.innerHTML = `<option value="">${esc(f.placeholder||'Select')}</option>` + opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
      if(record && record[f.key]!==undefined) sel.value = record[f.key];
    }
  });
  document.getElementById('formBackdrop').style.display='flex';
  const firstInput = body.querySelector('input,select,textarea');
  if(firstInput) setTimeout(()=>firstInput.focus(), 50);
}
function fieldHtml(f, record){
  const val = record ? (record[f.key]!==undefined? record[f.key] : '') : '';
  const reqStar = f.required? ' <span class="req">*</span>':'';
  let input='';
  if(f.type==='textarea'){
    input = `<textarea name="${f.key}">${esc(val)}</textarea>`;
  } else if(f.type==='select'){
    if(typeof f.options==='function'){
      input = `<select name="${f.key}"></select>`; // populated after insert
    } else {
      const opts = f.options();
      input = `<select name="${f.key}"><option value="">${esc(f.placeholder||'Select')}</option>${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===val?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
  } else {
    const extra = [];
    if(f.min!==undefined) extra.push(`min="${f.min}"`);
    if(f.max!==undefined) extra.push(`max="${f.max}"`);
    if(f.step) extra.push(`step="${f.step}"`);
    if(f.pattern) extra.push(`pattern="${f.pattern}"`);
    if(f.list) extra.push(`list="dl_${f.key}"`);
    input = `<input type="${f.type}" name="${f.key}" value="${esc(val)}" ${extra.join(' ')}>`;
  }
  return `<div class="field" data-field="${f.key}">
    <label>${esc(f.label)}${reqStar}</label>
    ${input}
    <div class="err"></div>
  </div>`;
}
function statusFieldHtml(record){
  const status = record ? (record.status||'Active') : 'Active';
  return `<div class="field" data-field="status">
    <label>Status</label>
    <div class="status-toggle">
      <label class="opt-active"><input type="radio" name="__status" value="Active" ${status==='Active'?'checked':''}><span>Active</span></label>
      <label class="opt-inactive"><input type="radio" name="__status" value="Inactive" ${status==='Inactive'?'checked':''}><span>Inactive</span></label>
    </div>
  </div>`;
}

async function performSave(){
  const m = MASTERS.find(x=>x.key===editState.store);
  const body = document.getElementById('formBody');
  let valid = true;
  const data = {};

  // clear old errors
  body.querySelectorAll('.field').forEach(f=>f.classList.remove('has-error'));

  m.fields.forEach(f=>{
    const el = body.querySelector(`[name="${f.key}"]`);
    let v = el.value;
    const fieldWrap = body.querySelector(`.field[data-field="${f.key}"]`);
    if(f.required && !v.trim()){
      showFieldError(fieldWrap, `${f.label} is required.`);
      valid = false; return;
    }
    if(f.type==='number' && v!==''){
      if(f.min!==undefined && Number(v) < f.min){ showFieldError(fieldWrap, `Must be ${f.min} or more.`); valid=false; return; }
      if(f.max!==undefined && Number(v) > f.max){ showFieldError(fieldWrap, `Must be ${f.max} or less.`); valid=false; return; }
    }
    if(f.pattern && v.trim() && !(new RegExp(f.pattern).test(v.trim()))){
      showFieldError(fieldWrap, f.patternMsg || 'Invalid value.');
      valid=false; return;
    }
    data[f.key] = f.type==='number' ? (v===''? '' : Number(v)) : v.trim();
  });

  // duplicate name check (case-insensitive, excluding self)
  const dupField = m.nameField;
  const dupVal = String(data[dupField]||'').trim().toLowerCase();
  if(dupVal){
    const clash = (cache[m.key]||[]).some(r=> r.id!==editState.id && String(r[dupField]||'').trim().toLowerCase()===dupVal);
    if(clash){
      const wrap = body.querySelector(`.field[data-field="${dupField}"]`);
      showFieldError(wrap, `A ${m.singular.toLowerCase()} with this ${m.dupKeyLabel.toLowerCase()} already exists.`);
      valid=false;
    }
  }

  if(!valid){ toast('Please fix the highlighted fields.', true); return; }

  const statusVal = body.querySelector('input[name="__status"]:checked').value;
  data.status = statusVal;

  const now = Date.now();
  let record;
  if(editState.id){
    record = (cache[m.key]||[]).find(r=>r.id===editState.id);
    record = Object.assign({}, record, data, {updatedAt:now});
  } else {
    record = Object.assign({id:uid(), createdAt:now, updatedAt:now}, data);
  }
  try{
    await dbPut(m.key, record);
    cache[m.key] = await dbGetAll(m.key);
    closeForm();
    toast(`${m.singular} ${editState.id? 'updated':'added'}.`);
    renderMasterView(m);
    if(currentKey===null) renderDashboard();
  }catch(e){
    toast('Could not save. Please try again.', true);
  }
}
function showFieldError(fieldWrap, msg){
  fieldWrap.classList.add('has-error');
  fieldWrap.querySelector('.err').textContent = msg;
}

/* ---------- shared helpers ---------- */
function getMaterial(type, id){ return (cache[type]||[]).find(x=>x.id===id); }
function materialLabel(type,id){ const m=getMaterial(type,id); return m? m.name : '—'; }
function unitOf(type,id){ const m=getMaterial(type,id); return m? m.unit : ''; }
function getMaterialOptions(){
  const rm = (cache.rawMaterials||[]).filter(m=>m.status!=='Inactive').map(m=>({value:'rawMaterials:'+m.id, label:m.name, type:'rawMaterials', id:m.id, unit:m.unit, rate:m.purchaseRate||m.avgCost||0}));
  const pm = (cache.packingMaterials||[]).filter(m=>m.status!=='Inactive').map(m=>({value:'packingMaterials:'+m.id, label:m.name, type:'packingMaterials', id:m.id, unit:m.unit, rate:m.purchaseRate||m.avgCost||0}));
  return {rm, pm};
}
function computeLine(row){
  const qty = Number(row.qty)||0, rate = Number(row.rate)||0;
  const base = qty*rate;
  const discAmt = base*(Number(row.discountPct)||0)/100;
  const taxable = base-discAmt;
  const taxAmt = taxable*(Number(row.gstPct)||0)/100;
  const lineTotal = taxable+taxAmt;
  return {base, discAmt, taxAmt, lineTotal, taxable};
}
function paymentStatus(p){
  if(p.paymentType==='Credit') return {label:'Credit · Due '+(p.dueDate||'—'), cls:'inactive'};
  return {label:'Paid ('+p.paymentType+')', cls:'active'};
}
function isLocked(purchase){
  return (purchase.items||[]).some(i=>(Number(i.consumedQty)||0) > 0);
}
async function nextSeq(name, prefix, pad){
  if(!cache.counters) cache.counters = await dbGetAll('counters');
  let c = cache.counters.find(x=>x.id===name);
  const seq = c ? c.seq+1 : 1;
  await dbPut('counters', {id:name, seq});
  if(c) c.seq = seq; else cache.counters.push({id:name, seq});
  return prefix+'-'+String(seq).padStart(pad,'0');
}
async function logAudit(action, entity, entityId, refNo, summary){
  await dbPut('auditLog', {id:uid(), ts:Date.now(), action, entity, entityId, refNo, summary});
  cache.auditLog = await dbGetAll('auditLog');
}
async function applyStockDelta(item, sign, meta){
  const mat = getMaterial(item.itemType, item.itemId);
  if(!mat) return;
  const costBasis = Number(item.rate)*(1-(Number(item.discountPct)||0)/100);
  const curQty = Number(mat.currentStock)||0, curCost = Number(mat.avgCost)||0;
  const newQtyRaw = curQty + sign*Number(item.qty);
  const newValue = curQty*curCost + sign*Number(item.qty)*costBasis;
  const safeQty = Math.max(0, round2(newQtyRaw));
  mat.currentStock = safeQty;
  mat.avgCost = safeQty>0 ? round2(newValue/safeQty) : 0;
  mat.updatedAt = Date.now();
  await dbPut(item.itemType, mat);
  const movement = {
    id:uid(), ts:Date.now(), itemType:item.itemType, itemId:item.itemId, itemName:item.itemName||mat.name,
    qtyChange: round2(sign*Number(item.qty)), reason:meta.reason, refType:meta.refType, refId:meta.refId,
    refNo:meta.refNo, balanceAfter:mat.currentStock, avgCostAfter:mat.avgCost
  };
  await dbPut('stockMovements', movement);
  cache[item.itemType] = await dbGetAll(item.itemType);
  cache.stockMovements = await dbGetAll('stockMovements');
}
function csvDownload(filename, rows){
  const csv = rows.map(r=> r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

window.onMaterialChange = function(rowId, value){

  row.itemType = type; row.itemId = id; row.itemName = mat.name; row.unit = mat.unit;
  if(!row.rate) row.rate = mat.purchaseRate || mat.avgCost || '';

};

async function performSavePurchase(){
  const purchaseDate = document.getElementById('pf_purchaseDate').value;
  const supplierId = document.getElementById('pf_supplierId').value;
  const invoiceNo = document.getElementById('pf_invoiceNo').value.trim();
  const invoiceDate = document.getElementById('pf_invoiceDate').value;
  const paymentType = document.getElementById('pf_paymentType').value;
  const dueDate = document.getElementById('pf_dueDate').value;
  const remarks = document.getElementById('pf_remarks').value.trim();
  const otherCharges = Number(document.getElementById('otherCharges').value)||0;

  if(!purchaseDate){ toast('Purchase date is required.', true); return; }
  if(!supplierId){ toast('Supplier is required.', true); return; }
  if(!invoiceNo){ toast('Invoice number is required.', true); return; }
  if(!paymentType){ toast('Payment type is required.', true); return; }
  if(paymentType==='Credit' && !dueDate){ toast('Due date is required for credit purchases.', true); return; }

  const validRows = pfState.items.filter(r=>r.itemType && r.itemId);
  if(validRows.length===0){ toast('Add at least one item.', true); return; }
  for(const r of validRows){
    if(!(Number(r.qty) > 0)){ toast(`Quantity for ${r.itemName} must be greater than 0.`, true); return; }
    if(Number(r.rate) < 0){ toast(`Rate for ${r.itemName} cannot be negative.`, true); return; }
    if(Number(r.discountPct)<0 || Number(r.discountPct)>100){ toast(`Discount % for ${r.itemName} must be 0–100.`, true); return; }
    if(Number(r.gstPct)<0 || Number(r.gstPct)>100){ toast(`GST % for ${r.itemName} must be 0–100.`, true); return; }
  }

  const dupInvoice = (cache.purchases||[]).some(p=> p.id!==pfState.id && p.supplierId===supplierId && String(p.invoiceNo).trim().toLowerCase()===invoiceNo.toLowerCase());
  if(dupInvoice){ toast('This invoice number already exists for this supplier.', true); return; }

  let original = null;
  if(pfState.id){
    original = (cache.purchases||[]).find(x=>x.id===pfState.id);
    if(original && isLocked(original)){ toast('This purchase has consumed stock and cannot be edited.', true); return; }
  }

  const items = validRows.map(r=>{
    const c = computeLine(r);
    return {
      id: r.rowId, itemType:r.itemType, itemId:r.itemId, itemName:r.itemName, unit:r.unit,
      qty:Number(r.qty), rate:Number(r.rate), discountPct:Number(r.discountPct)||0, discountAmt:round2(c.discAmt),
      gstPct:Number(r.gstPct)||0, taxAmt:round2(c.taxAmt), lineTotal:round2(c.lineTotal),
      consumedQty:Number(r.consumedQty)||0, returnedQty:Number(r.returnedQty)||0
    };
  });
  const totalQty = items.reduce((s,i)=>s+i.qty,0);
  const subTotal = round2(items.reduce((s,i)=>s+i.qty*i.rate,0));
  const totalDiscount = round2(items.reduce((s,i)=>s+i.discountAmt,0));
  const totalGst = round2(items.reduce((s,i)=>s+i.taxAmt,0));
  const grandTotal = round2(subTotal - totalDiscount + totalGst + otherCharges);

  const now = Date.now();
  let purchaseNo = original ? original.purchaseNo : await nextSeq('purchase','PUR',4);
  const record = {
    id: pfState.id || uid(), purchaseNo, purchaseDate, supplierId, invoiceNo, invoiceDate, paymentType, dueDate, remarks,
    items, totalQty, subTotal, totalDiscount, totalGst, otherCharges, grandTotal,
    createdAt: original ? original.createdAt : now, updatedAt: now
  };

  try{
    if(original){
      for(const it of original.items){
        await applyStockDelta(it, -1, {reason:'Purchase Edit — Reverse', refType:'purchase', refId:record.id, refNo:record.purchaseNo});
      }
    }
    await dbPut('purchases', record);
    for(const it of items){
      await applyStockDelta(it, +1, {reason: original? 'Purchase Edit — Apply' : 'Purchase', refType:'purchase', refId:record.id, refNo:record.purchaseNo});
    }
    cache.purchases = await dbGetAll('purchases');
    await logAudit(original?'EDIT':'CREATE', 'Purchase', record.id, record.purchaseNo, `${original?'Edited':'Created'} purchase ${record.purchaseNo} — ₹${grandTotal.toFixed(2)}`);
    toast(`Purchase ${record.purchaseNo} ${original?'updated':'saved'}.`);
    renderPurchaseList();
    if(currentKey===null) renderDashboard();
  }catch(e){
    toast('Could not save purchase. Please try again.', true);
  }
}

    rows = rows.filter(p=> p.purchaseNo.toLowerCase().includes(q) || String(p.invoiceNo).toLowerCase().includes(q));
  }
  if(pListFilters.supplierId) rows = rows.filter(p=>p.supplierId===pListFilters.supplierId);
  if(pListFilters.from) rows = rows.filter(p=>p.purchaseDate >= pListFilters.from);
  if(pListFilters.to) rows = rows.filter(p=>p.purchaseDate <= pListFilters.to);
  if(pListFilters.paymentType) rows = rows.filter(p=>p.paymentType===pListFilters.paymentType);
  rows.sort((a,b)=> (b.purchaseDate||'').localeCompare(a.purchaseDate||'') || b.createdAt-a.createdAt);

  if(rows.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="es-icon">🧾</div><h4>No purchases found</h4><p>Try adjusting filters, or click "+ New Purchase".</p></div>`;
    return;
  }
  const thead = `<thead><tr><th>Purchase No</th><th>Date</th><th>Supplier</th><th>Invoice No</th><th>Grand Total</th><th>Payment Status</th><th></th></tr></thead>`;
  const tbody = rows.map(p=>{
    const st = paymentStatus(p);
    const locked = isLocked(p);
    return `<tr>
      <td data-label="Purchase No" class="mono">${esc(p.purchaseNo)}</td>
      <td data-label="Date">${esc(p.purchaseDate)}</td>
      <td data-label="Supplier">${esc(materialSupplierName(p.supplierId))}</td>
      <td data-label="Invoice No">${esc(p.invoiceNo)}</td>
      <td data-label="Grand Total" class="mono">₹${Number(p.grandTotal).toFixed(2)}</td>
      <td data-label="Status"><span class="badge ${st.cls}">${st.label}</span></td>
      <td class="row-actions-cell">
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-act="view" data-id="${p.id}">View</button>
          <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${p.id}" ${locked?'disabled title="Locked: stock consumed"':''}>Edit</button>
          <button class="btn btn-ghost btn-sm" data-act="print" data-id="${p.id}">Print</button>
          <button class="btn btn-danger btn-sm" data-act="del" data-id="${p.id}" ${locked?'disabled title="Locked: stock consumed"':''}>Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>${thead}<tbody>${tbody}</tbody></table>`;
  wrap.querySelectorAll('[data-act=view]').forEach(b=> b.onclick=()=>renderPurchaseView(b.dataset.id));
  wrap.querySelectorAll('[data-act=edit]').forEach(b=> b.onclick=()=>openPurchaseForm(b.dataset.id));
  wrap.querySelectorAll('[data-act=print]').forEach(b=> b.onclick=()=>printPurchase(b.dataset.id));
  wrap.querySelectorAll('[data-act=del]').forEach(b=> b.onclick=()=>confirmDeletePurchase(b.dataset.id));
}
function materialSupplierName(id){ return supplierName(id); }

function confirmDeletePurchase(id){
  const p = (cache.purchases||[]).find(x=>x.id===id);
  if(!p) return;
  if(isLocked(p)){ toast('This purchase has consumed stock in manufacturing and cannot be deleted.', true); return; }
  openConfirmGeneric(`Delete purchase "${p.purchaseNo}" (₹${Number(p.grandTotal).toFixed(2)})? Stock will be reversed. This cannot be undone.`, async ()=>{
    try{
      for(const it of p.items){
        await applyStockDelta(it, -1, {reason:'Purchase Delete', refType:'purchase', refId:p.id, refNo:p.purchaseNo});
      }
      await dbDelete('purchases', id);
      cache.purchases = await dbGetAll('purchases');
      await logAudit('DELETE','Purchase', id, p.purchaseNo, `Deleted purchase ${p.purchaseNo} — ₹${Number(p.grandTotal).toFixed(2)} (stock reversed)`);
      toast(`Purchase ${p.purchaseNo} deleted.`);
      renderPurchaseList();
      if(currentKey===null) renderDashboard();
    }catch(e){
      toast('Could not delete purchase.', true);
    }
  });
}

async function performSaveReturn(){
  const purchaseId = document.getElementById('rf_purchaseId').value;
  const date = document.getElementById('rf_date').value;
  const itemRowId = document.getElementById('rf_material').value;
  const qty = Number(document.getElementById('rf_qty').value);
  const reason = document.getElementById('rf_reason').value.trim();

  if(!purchaseId){ toast('Select a purchase reference.', true); return; }
  if(!date){ toast('Date is required.', true); return; }
  if(!itemRowId){ toast('Select a material.', true); return; }
  if(!(qty>0)){ toast('Quantity returned must be greater than 0.', true); return; }

  const p = (cache.purchases||[]).find(x=>x.id===purchaseId);
  const item = p.items.find(i=>i.id===itemRowId);
  const available = round2(item.qty - (item.returnedQty||0) - (item.consumedQty||0));
  if(qty > available){ toast(`Cannot return more than available (${available} ${item.unit}).`, true); return; }

  const mat = getMaterial(item.itemType, item.itemId);
  const returnNo = await nextSeq('purchaseReturn','PRTN',4);
  const retObj = {
    id: uid(), returnNo, purchaseId: p.id, purchaseNo: p.purchaseNo, date, supplierId: p.supplierId,
    itemType: item.itemType, itemId: item.itemId, itemName: item.itemName, qty, reason, createdAt: Date.now()
  };
  try{
    await dbPut('purchaseReturns', retObj);
    item.returnedQty = round2((item.returnedQty||0) + qty);
    await dbPut('purchases', p);
    cache.purchases = await dbGetAll('purchases');
    cache.purchaseReturns = await dbGetAll('purchaseReturns');
    await applyStockDelta({itemType:item.itemType, itemId:item.itemId, itemName:item.itemName, qty, rate: mat.avgCost||0, discountPct:0}, -1,
      {reason:'Purchase Return', refType:'purchaseReturn', refId:retObj.id, refNo:retObj.returnNo});
    await logAudit('RETURN','PurchaseReturn', retObj.id, retObj.returnNo, `Returned ${qty} ${item.unit} of ${item.itemName} against ${p.purchaseNo}`);
    toast(`Return ${returnNo} saved.`);
    renderReturnList();
    if(currentKey===null) renderDashboard();
  }catch(e){
    toast('Could not save return.', true);
  }
}
function confirmDeleteReturn(id){
  const r = (cache.purchaseReturns||[]).find(x=>x.id===id);
  if(!r) return;
  openConfirmGeneric(`Delete return "${r.returnNo}"? The returned stock will be added back.`, async ()=>{
    try{
      const mat = getMaterial(r.itemType, r.itemId);
      await applyStockDelta({itemType:r.itemType, itemId:r.itemId, itemName:r.itemName, qty:r.qty, rate: mat? mat.avgCost:0, discountPct:0}, +1,
        {reason:'Purchase Return Deleted', refType:'purchaseReturn', refId:r.id, refNo:r.returnNo});
      const p = (cache.purchases||[]).find(x=>x.id===r.purchaseId);
      if(p){
        const item = p.items.find(i=>i.id===r.itemId || (i.itemType===r.itemType && i.itemId===r.itemId));
        if(item) item.returnedQty = round2(Math.max(0,(item.returnedQty||0) - r.qty));
        await dbPut('purchases', p);
        cache.purchases = await dbGetAll('purchases');
      }
      await dbDelete('purchaseReturns', id);
      cache.purchaseReturns = await dbGetAll('purchaseReturns');
      await logAudit('DELETE','PurchaseReturn', id, r.returnNo, `Deleted return ${r.returnNo} — stock reversed`);
      toast(`Return ${r.returnNo} deleted.`);
      renderReturnList();
    }catch(e){
      toast('Could not delete return.', true);
    }
  });
}

function runReport(){
  const from = document.getElementById('rp_from').value;
  const to = document.getElementById('rp_to').value;
  const supplierId = document.getElementById('rp_supplier').value;
  const matQ = document.getElementById('rp_material').value.trim().toLowerCase();
  const catQ = document.getElementById('rp_category').value.trim().toLowerCase();
  const payType = document.getElementById('rp_payType').value;

  const agg = {}; // key: itemType|itemId -> {name, unit, qty, value}
  let purchaseCount = 0, grandValue = 0;

  (cache.purchases||[]).forEach(p=>{
    if(from && p.purchaseDate < from) return;
    if(to && p.purchaseDate > to) return;
    if(supplierId && p.supplierId !== supplierId) return;
    if(payType && p.paymentType !== payType) return;
    let matched = false;
    p.items.forEach(i=>{
      if(matQ && !i.itemName.toLowerCase().includes(matQ)) return;
      if(catQ){
        const mat = getMaterial(i.itemType, i.itemId);
        const cat = mat && mat.category ? mat.category.toLowerCase() : '';
        if(!cat.includes(catQ)) return;
      }
      matched = true;
      const key = i.itemType+'|'+i.itemId;
      if(!agg[key]) agg[key] = {name:i.itemName, unit:i.unit, qty:0, value:0};
      agg[key].qty += i.qty;
      agg[key].value += (i.qty*i.rate - i.discountAmt);
      grandValue += i.lineTotal;
    });
    if(matched) purchaseCount++;
  });

  const rows = Object.values(agg).map(r=>({...r, avg: r.qty>0 ? r.value/r.qty : 0}));
  rows.sort((a,b)=> b.value - a.value);

  const totalQty = rows.reduce((s,r)=>s+r.qty,0);
  const totalValue = rows.reduce((s,r)=>s+r.value,0);

  const results = document.getElementById('rpResults');
  if(rows.length===0){
    results.innerHTML = `<div class="empty-state"><div class="es-icon">📊</div><h4>No matching purchase data</h4><p>Adjust the filters and run the report again.</p></div>`;
    return;
  }
  results.innerHTML = `
    <div class="report-summary">
      <div class="rs-card"><div class="tl">Purchases Matched</div><div class="tv">${purchaseCount}</div></div>
      <div class="rs-card"><div class="tl">Total Qty</div><div class="tv">${round2(totalQty)}</div></div>
      <div class="rs-card"><div class="tl">Purchase Value</div><div class="tv">₹${totalValue.toFixed(2)}</div></div>
      <div class="rs-card"><div class="tl">Avg Price</div><div class="tv">₹${(totalQty>0?totalValue/totalQty:0).toFixed(2)}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-ghost btn-sm" id="rpExportCsv">Export CSV (Excel)</button>
      <button class="btn btn-ghost btn-sm" id="rpPrint">Print / Save as PDF</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Material</th><th>Unit</th><th>Qty Purchased</th><th>Purchase Value</th><th>Avg Price</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td data-label="Material">${esc(r.name)}</td>
          <td data-label="Unit">${esc(r.unit)}</td>
          <td data-label="Qty Purchased">${round2(r.qty)}</td>
          <td data-label="Purchase Value" class="mono">₹${r.value.toFixed(2)}</td>
          <td data-label="Avg Price" class="mono">₹${r.avg.toFixed(2)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;
  document.getElementById('rpExportCsv').onclick = ()=>{
    const csvRows = [['Material','Unit','Qty Purchased','Purchase Value','Avg Price']];
    rows.forEach(r=> csvRows.push([r.name, r.unit, round2(r.qty), r.value.toFixed(2), r.avg.toFixed(2)]));
    csvRows.push([]); csvRows.push(['Total','', round2(totalQty), totalValue.toFixed(2), (totalQty>0?totalValue/totalQty:0).toFixed(2)]);
    csvDownload('purchase_report.csv', csvRows);
  };
  document.getElementById('rpPrint').onclick = ()=>{
    const html = `
      <h2>Sundaravalli Cottage Industries</h2>
      <div class="p-sub">Purchase Report</div>
      <table>
        <thead><tr><th>Material</th><th>Unit</th><th>Qty Purchased</th><th>Purchase Value</th><th>Avg Price</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td>${round2(r.qty)}</td><td>₹${r.value.toFixed(2)}</td><td>₹${r.avg.toFixed(2)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="p-totals"><strong>Total Qty: ${round2(totalQty)} &nbsp; | &nbsp; Total Value: ₹${totalValue.toFixed(2)} &nbsp; | &nbsp; Avg Price: ₹${(totalQty>0?totalValue/totalQty:0).toFixed(2)}</strong></div>
    `;
    doPrint(html);
  };
}

boot();
</script>
</body>
</html>
